<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New tab</title>
  <style>
    @font-face {
      font-family: "Public Sans";
      src: url("/font/public-sans.woff2") format("woff2");
      font-weight: 400 700;
      font-display: block;
    }

    :root {
      --void: #0b0b0f;
      --ink: #f4f5f9;
      --ink-2: rgba(244, 245, 249, 0.66);
      --ink-3: rgba(244, 245, 249, 0.42);
      --glass-core: rgba(255, 255, 255, 0.05);
      --glass-hover: rgba(255, 255, 255, 0.10);
      --hairline: rgba(255, 255, 255, 0.10);
      --sheen: inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 -1px 0 rgba(255, 255, 255, 0.03);
      --blur: blur(24px) saturate(160%);
      --accent: #9dbcff;
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--void);
      color: var(--ink);
      font: 13px/1.45 "Public Sans", system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      overflow-x: hidden;
    }

    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 64px 40px 56px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    h2 {
      margin: 0 0 14px 6px;
      font-size: 18px;
      font-weight: 500;
      color: var(--ink-2);
    }

    /* Double bezel for the search field: a hairline shell around a glass core. */
    .search-shell {
      max-width: 640px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 0 0 1px var(--hairline);
    }

    .search {
      display: flex;
      align-items: center;
      height: 52px;
      padding: 0 20px;
      border-radius: 999px;
      background: rgba(6, 6, 10, 0.5);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      box-shadow: var(--sheen);
      transition: box-shadow 420ms var(--ease), background-color 420ms var(--ease);
    }

    .search:focus-within {
      background: rgba(6, 6, 10, 0.7);
      box-shadow: var(--sheen), 0 0 0 1px rgba(157, 188, 255, 0.4);
    }

    .search input {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      user-select: text;
      -webkit-user-select: text;
    }

    .search input::placeholder { color: var(--ink-3); }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      margin-top: 44px;
    }

    /* Glass panel: a hairline outer shell and a blurred inner core with a lit top edge. */
    .panel {
      padding: 6px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.03);
      box-shadow: inset 0 0 0 1px var(--hairline);
    }

    .panel-core {
      min-height: 120px;
      padding: 8px;
      border-radius: 25px;
      background: var(--glass-core);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      box-shadow: var(--sheen);
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 46px;
      padding: 0 14px;
      border-radius: 16px;
      transition: background-color 360ms var(--ease), transform 560ms var(--ease);
    }

    li:hover {
      background: var(--glass-hover);
      transform: translate3d(2px, 0, 0);
    }

    li a {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ink);
      text-decoration: none;
    }

    li a:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: -1px;
      border-radius: 6px;
    }

    .url {
      flex: 0 1 36%;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: var(--ink-3);
    }

    .empty {
      margin: 8px;
      padding: 14px 16px;
      border-radius: 18px;
      box-shadow: inset 0 0 0 1px var(--hairline);
      color: var(--ink-2);
    }

    /* Scroll reveal. Transform and opacity only, one step per block. */
    .reveal {
      opacity: 0;
      transform: translate3d(0, 22px, 0);
      transition: opacity 800ms var(--ease), transform 900ms var(--ease);
    }

    .reveal.in {
      opacity: 1;
      transform: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>New tab</h1>
    <div class="search-shell reveal">
      <form class="search" action="https://www.google.com/search" method="get" role="search">
        <input type="search" name="q" placeholder="Search Google or type a URL" aria-label="Search Google or type a URL" autocomplete="off" spellcheck="false" autofocus>
      </form>
    </div>
    <div class="columns">
      <section class="reveal" aria-labelledby="bookmarks-title">
        <h2 id="bookmarks-title">Bookmarks</h2>
        <div class="panel"><div class="panel-core">
          <ul id="bookmarks"></ul>
          <p class="empty" id="bookmarks-empty" hidden>No bookmarks yet. Press Ctrl+D on a page to add one.</p>
        </div></div>
      </section>
      <section class="reveal" aria-labelledby="recent-title" style="transition-delay: 120ms">
        <h2 id="recent-title">Recently visited</h2>
        <div class="panel"><div class="panel-core">
          <ul id="recent"></ul>
          <p class="empty" id="recent-empty" hidden>Pages you visit will show up here.</p>
        </div></div>
      </section>
    </div>
  </main>
  <script>
    (function () {
      var BOOKMARKS_KEY = 'tsgpui-browser.bookmarks';
      var HISTORY_KEY = 'tsgpui-browser.history';

      function readList(key) {
        try { return JSON.parse(localStorage.getItem(key)) || []; } catch (error) { return []; }
      }

      function host(url) {
        try { return new URL(url).host || url; } catch (error) { return url; }
      }

      function fill(list, emptyId, items) {
        var empty = document.getElementById(emptyId);
        empty.hidden = items.length > 0;
        items.forEach(function (item) {
          var row = document.createElement('li');
          var link = document.createElement('a');
          link.href = item.url;
          link.textContent = item.title || item.url;
          link.title = item.url;
          var where = document.createElement('span');
          where.className = 'url';
          where.textContent = host(item.url);
          row.appendChild(link);
          row.appendChild(where);
          list.appendChild(row);
        });
      }

      fill(document.getElementById('bookmarks'), 'bookmarks-empty', readList(BOOKMARKS_KEY).slice(0, 12));
      fill(document.getElementById('recent'), 'recent-empty', readList(HISTORY_KEY).slice(0, 10));

      // Reveal each block once, as it scrolls or first appears.
      var blocks = document.querySelectorAll('.reveal');
      if ('IntersectionObserver' in window) {
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('in');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12 });
        blocks.forEach(function (block) { observer.observe(block); });
      } else {
        blocks.forEach(function (block) { block.classList.add('in'); });
      }
    })();
  </script>
</body>
</html>
